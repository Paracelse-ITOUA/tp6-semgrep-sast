name: DevSecOps - Semgrep SAST Scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  semgrep-sast:
    name: Semgrep SAST Quality Gate
    runs-on: ubuntu-latest

    container:
      image: semgrep/semgrep@sha256:6e1b04340e60e910fbb4ddbf3c857ab0918f064417ad5ac530014ccb3cf8c8f1

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run Semgrep SAST Analysis
        run: |
          semgrep scan \
            --config "p/default" \
            --config "p/owasp-top-ten" \
            --metrics=off \
            --sarif \
            --output semgrep-results.sarif \
            --error

      - name: Upload SARIF report to GitHub
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4
        if: always() && hashFiles('semgrep-results.sarif') != ''
        with:
          sarif_file: semgrep-results.sarif